<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Preconnect early to eliminate DNS + TLS round-trips before any resources load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.googletagmanager.com">

    <!-- SEO, Open Graph, Twitter Card, canonical URL, JSON-LD structured data -->
    {% seo %}

    <!-- RSS feed discovery -->
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

    <!-- Security headers (meta equivalents — real HTTP headers not settable on GitHub Pages) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src https://www.google-analytics.com https://analytics.google.com; base-uri 'self'; form-action 'none';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=()">

    <!-- GA loader — init and font loading handled in main.js to avoid inline scripts -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9C3D6NBD6G"></script>

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
    <div class="spotlight" id="spotlight"></div>

{% include header.html %}

    <main class="main-content">
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
